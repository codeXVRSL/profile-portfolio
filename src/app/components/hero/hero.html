<section class="hero" id="top">
  <div class="hero-inner">
    <p class="kicker" appReveal="fade">{{ profile.subtitle }}</p>

    <h1 class="headline" appMaskReveal [maskImmediate]="true" [maskDelay]="0.15">
      <span class="line">Christian Jay</span>
      <span class="line">De La Cruz<span class="mark">.</span></span>
    </h1>

    <div class="hero-grid">
      <p class="tagline" appReveal="slide-up" [revealDelay]="180">
        {{ profile.tagline }}
      </p>
      <div class="hero-meta" appReveal="slide-up" [revealDelay]="240">
        <span class="meta-item available">
          <span class="pulse" aria-hidden="true"></span>
          Open to new roles
        </span>
        <span class="meta-item">{{ profile.location }}</span>
      </div>
    </div>

    <div class="cta-row" appReveal="slide-up" [revealDelay]="320">
      <a class="btn btn-solid" href="#projects" appMagnetic [magneticStrength]="0.28">
        <span>View projects</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/><path d="m13 5 7 7-7 7"/>
        </svg>
      </a>
      <a
        class="btn btn-outline"
        appMagnetic
        [magneticStrength]="0.28"
        [href]="profile.resumeFile"
        [attr.download]="profile.resumeDownloadName"
      >
        <span>Download resume</span>
      </a>
      <a class="btn btn-ghost" href="#contact">Get in touch</a>
    </div>
  </div>

  <div class="ticker" aria-hidden="true" appReveal="fade" [revealDelay]="450">
    <div class="ticker-track">
      @for (pass of [0, 1]; track pass) {
        <span class="ticker-group">
          @for (item of ticker; track item) {
            <span class="ticker-item">{{ item }}</span>
          }
        </span>
      }
    </div>
  </div>
</section>
